# Copied verbatim by cookiecutter (_copy_without_render), so no {{cookiecutter.*}} here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]

jobs:
  style:
    name: "Style: ${{ matrix.tool }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [isort, black, flake8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install gettext (msgfmt compiles the translations at build time)
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Install plugin with dev tools
        run: python -m pip install -e ".[dev]"
      - name: isort
        if: matrix.tool == 'isort'
        run: isort --check-only --diff .
      - name: black
        if: matrix.tool == 'black'
        run: black --check .
      - name: flake8
        if: matrix.tool == 'flake8'
        run: flake8 .

  tests:
    name: "Tests: Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Check out byro core
        uses: actions/checkout@v7
        with:
          repository: byro/byro
          path: byro
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install byro (editable)
        run: python -m pip install -e byro/src
      - name: Install gettext (msgfmt compiles the translations at build time)
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Install plugin with dev tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
        env:
          BYRO_DB_ENGINE: sqlite3

  # Same release flow as the byro core: the version is not maintained in the
  # code (``__version__`` is a dev placeholder) but written from the release
  # tag when a GitHub release is published, then the package is built and
  # uploaded to PyPI via trusted publishing.
  build:
    name: Build package
    needs: [style, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install gettext (msgfmt compiles the translations at build time)
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Install build tools
        run: python -m pip install build twine
      - name: Set version from release tag
        if: github.event_name == 'release' && github.event.action == 'published'
        run: sed -i 's/__version__.*/__version__ = "${{ github.event.release.tag_name }}"/' byro_finance_import_bank_files/__init__.py
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package
        run: twine check dist/*
      - name: Upload build result
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  pypi-publish:
    name: Upload release to PyPI
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/byro-finance-import-bank-files
    permissions:
      id-token: write
    steps:
      - name: Download build result
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
